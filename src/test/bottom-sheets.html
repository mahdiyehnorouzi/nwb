<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>NWB Bottom Sheets</title>

    <link rel="stylesheet" href="/build/nwb.css">
    <script src="/build/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwindConfig) {
        tailwind.config = window.tailwindConfig;
      }
    </script>

    <script type="module" src="/build/nwb.esm.js"></script>
    <script nomodule src="/build/nwb.js"></script>

    <style>
      body {
        font-family: sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .theme-bg {
        background-color: var(--n-bg-primary);
        color: var(--n-text-primary);
      }

      .test-section {
        margin-bottom: 2rem;
        padding: 1.5rem;
        border: 1px solid var(--n-border-primary);
        border-radius: 8px;
        background: var(--n-bg-secondary);
      }

      .test-button {
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid var(--n-border-primary);
        background: var(--n-bg-primary);
        color: var(--n-text-primary);
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .test-button:hover {
        opacity: 0.85;
        transform: translateY(-1px);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
      }

      .control {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--n-border-primary);
        border-radius: 6px;
        background: var(--n-bg-primary);
      }
    </style>
  </head>
  <body class="theme-bg p-8 min-h-screen">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-3xl font-bold text-primary mb-8">NWB Bottom Sheets</h1>

      <div class="test-section">
        <h3 class="text-xl font-semibold mb-3">Basic</h3>
        <button class="test-button" id="open-basic">Open Bottom Sheet</button>

        <div class="controls">
          <label class="control">
            <input type="checkbox" id="closable" checked />
            <span>closable</span>
          </label>
          <label class="control">
            <input type="checkbox" id="backdropClose" checked />
            <span>canBackdropClose</span>
          </label>
          <label class="control">
            <input type="checkbox" id="swipeClose" checked />
            <span>canSwipeClose</span>
          </label>
          <label class="control">
            <input type="checkbox" id="blocking" checked />
            <span>blocking</span>
          </label>
          <label class="control">
            <input type="checkbox" id="hashBased" checked />
            <span>hashBased</span>
          </label>
          <label class="control">
            <input type="checkbox" id="expandable" />
            <span>expandable</span>
          </label>
          <label class="control">
            <input type="checkbox" id="removeFooterPadding" />
            <span>removeFooterPadding</span>
          </label>
        </div>

        <div class="mt-3 text-sm">
          <div><strong>instinctHeight</strong>: <span id="instinctHeight">-</span></div>
          <div><strong>closingStarted</strong>: <span id="closingReason">-</span></div>
          <div><strong>updateModelValue</strong>: <span id="modelValueEvent">-</span></div>
        </div>
      </div>

      <n-bottom-sheet id="sheet-basic">
        <div slot="header" class="flex items-center justify-between">
          <div class="text-c1 font-semibold">Bottom Sheet</div>
        </div>

        <div class="space-y-3">
          <p class="text-sm">
            This is the sheet content. Try backdrop click, swipe down, hash-based back button, and expandable mode.
          </p>
          <div class="p-3 bg-neutral-20 rounded">
            <p class="text-sm">Nested content box</p>
          </div>
          <div style="height: 600px;" class="p-3 bg-neutral-10 rounded">
            <p class="text-sm">Extra height to test scrolling</p>
          </div>
        </div>

        <div slot="footer" class="flex items-center justify-end gap-2">
          <button class="test-button" id="footer-cancel" style="padding: 0.5rem 0.75rem;">Cancel</button>
          <button class="test-button" id="footer-ok" style="padding: 0.5rem 0.75rem;">OK</button>
        </div>
      </n-bottom-sheet>
    </div>

    <script>
      // Theme synchronization with parent window
      function applyTheme() {
        const savedTheme = localStorage.getItem('theme');
        const html = document.documentElement;

        if (savedTheme === 'dark') {
          html.classList.add('dark');
        } else {
          html.classList.remove('dark');
        }
      }

      applyTheme();

      window.addEventListener('storage', (e) => {
        if (e.key === 'theme') applyTheme();
      });

      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'theme-change') applyTheme();
      });

      setInterval(applyTheme, 1000);

      // Demo wiring
      const sheet = document.getElementById('sheet-basic');
      const openBtn = document.getElementById('open-basic');
      const footerCancel = document.getElementById('footer-cancel');
      const footerOk = document.getElementById('footer-ok');

      const instinctHeightEl = document.getElementById('instinctHeight');
      const closingReasonEl = document.getElementById('closingReason');
      const modelValueEventEl = document.getElementById('modelValueEvent');

      function syncProps() {
        sheet.closable = document.getElementById('closable').checked;
        sheet.canBackdropClose = document.getElementById('backdropClose').checked;
        sheet.canSwipeClose = document.getElementById('swipeClose').checked;
        sheet.blocking = document.getElementById('blocking').checked;
        sheet.hashBased = document.getElementById('hashBased').checked;
        sheet.expandable = document.getElementById('expandable').checked;
        sheet.removeFooterPadding = document.getElementById('removeFooterPadding').checked;

        sheet.duration = 300;
        sheet.height = 320;
        sheet.snapPoints = [320, '60%'];
        sheet.initialSnapPoint = 0;
      }

      document.querySelectorAll('input[type="checkbox"]').forEach((el) => {
        el.addEventListener('change', syncProps);
      });
      syncProps();

      openBtn.addEventListener('click', async () => {
        syncProps();
        await sheet.open();
      });

      function closeSheet() {
        sheet.close();
      }

      footerCancel.addEventListener('click', closeSheet);
      footerOk.addEventListener('click', () => {
        console.log('OK clicked');
        closeSheet();
      });

      sheet.addEventListener('instinct-height', (e) => {
        instinctHeightEl.textContent = e.detail;
      });

      sheet.addEventListener('closing-started', (e) => {
        closingReasonEl.textContent = e.detail && e.detail.reason ? e.detail.reason : '(unknown)';
      });

      sheet.addEventListener('updateModelValue', (e) => {
        modelValueEventEl.textContent = String(e.detail);
      });
    </script>
  </body>
</html>
